name: Apply Ruff fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/company-brain-portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: python -m pip install --upgrade pip "ruff>=0.6,<1.0"
      - name: Apply formatting and remaining line fixes
        run: |
          ruff check . --fix
          ruff format .
          python - <<'PY'
          from pathlib import Path

          bot_path = Path("app/bot/main.py")
          bot = bot_path.read_text(encoding="utf-8")
          bot = bot.replace(
              '        status_line = f"\\n\\nСтатус: готових {len(ready)}, обробляється {processing_count}, помилок {failed_count}."',
              '        status_line = (\n'
              '            f"\\n\\nСтатус: готових {len(ready)}, "\n'
              '            f"обробляється {processing_count}, помилок {failed_count}."\n'
              '        )',
          )
          bot = bot.replace(
              '                    f"ℹ️ Цей документ уже додано, але його статус: {payload.get(\'status\', \'unknown\')}.",',
              '                    (\n'
              '                        "ℹ️ Цей документ уже додано, але його статус: "\n'
              '                        f"{payload.get(\'status\', \'unknown\')}."\n'
              '                    ),',
          )
          bot_path.write_text(bot, encoding="utf-8")

          embeddings_path = Path("app/services/embeddings.py")
          embeddings = embeddings_path.read_text(encoding="utf-8")
          embeddings = embeddings.replace(
              '    if vectors.ndim != 2 or vectors.shape[1] != settings.embedding_dimension:\n'
              '        raise EmbeddingDimensionError(\n'
              '            f"Embedding model returned dimension {vectors.shape[1] if vectors.ndim == 2 else \'unknown\'}, "\n'
              '            f"expected {settings.embedding_dimension}"\n'
              '        )',
              '    if vectors.ndim != 2 or vectors.shape[1] != settings.embedding_dimension:\n'
              '        actual_dimension = vectors.shape[1] if vectors.ndim == 2 else "unknown"\n'
              '        raise EmbeddingDimensionError(\n'
              '            f"Embedding model returned dimension {actual_dimension}, "\n'
              '            f"expected {settings.embedding_dimension}"\n'
              '        )',
          )
          embeddings_path.write_text(embeddings, encoding="utf-8")
          PY
          ruff format .
          ruff check .
          ruff format --check .
      - name: Commit fixes to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app eval migrations tests
          if git diff --cached --quiet; then
            echo "No formatting changes to commit"
            exit 0
          fi
          git commit -m "style: apply Ruff fixes [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
