name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff
        id: ruff
        continue-on-error: true
        run: |
          set +e
          ruff check . --fix 2>&1 | tee ruff-fix.log
          ruff format . 2>&1 | tee ruff-format.log
          git diff --binary > ruff-fixes.patch
          ruff check . --output-format=concise 2>&1 | tee ruff-check.log
          check_status=${PIPESTATUS[0]}
          ruff format --check . 2>&1 | tee ruff-format-check.log
          format_status=${PIPESTATUS[0]}
          if [ "$check_status" -ne 0 ] || [ "$format_status" -ne 0 ]; then
            exit 1
          fi
      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: |
            ruff-fix.log
            ruff-format.log
            ruff-fixes.patch
            ruff-check.log
            ruff-format-check.log
          if-no-files-found: error
          retention-days: 3
      - name: Upload formatted source files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-formatted-files
          path: |
            app/api/routes_chat.py
            app/bot/main.py
            app/core/config.py
            app/db/models.py
            app/services/document_indexer.py
            app/workers/indexer.py
            eval/run_eval.py
            migrations/env.py
            migrations/versions/0001_initial.py
            migrations/versions/0002_access_feedback.py
            tests/test_config_principals.py
          if-no-files-found: error
          retention-days: 3
      - name: Tests
        run: pytest -q
      - name: Compile
        run: python -m compileall -q app scripts migrations
      - name: Enforce Ruff result
        if: always() && steps.ruff.outcome == 'failure'
        run: exit 1

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-rag:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
