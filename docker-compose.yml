services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
    networks: [backend]

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - huggingface_cache:/models/huggingface
    networks: [backend]
    security_opt:
      - no-new-privileges:true

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.workers.indexer"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - huggingface_cache:/models/huggingface
    networks: [backend]
    security_opt:
      - no-new-privileges:true

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    command: ["python", "-m", "app.bot.main"]
    env_file: .env
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    profiles: ["bot"]
    networks: [backend]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  huggingface_cache:

networks:
  backend:
    driver: bridge
